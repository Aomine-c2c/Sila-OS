# KAIROS OS - Limine Bootloader Configuration
# Location: /boot/limine/limine.conf

# Set the default boot entry (0 = first entry)
timeout=3

# Enable graphical boot menu
# graphical_mode=yes

# Set the default terminal mode (max for best resolution)
console_mode=max

# Disable editor to prevent runtime modifications
editor=no

# Disable auto-detection of kernel entries
# auto-entries=no

# Enable automatic firmware detection
auto-firmware=1

# Default boot entry
default=kairos

# Boot entries for KAIROS OS

# Normal boot entry
:KAIROS OS (Adaptive Trading Operating System)
protocol=limine
kernel=vmlinuz-kairos
module=/initramfs-kairos.img
options=root=LABEL=KAIROS_ROOT rootflags=subvol=@ ro quiet loglevel=3 kairos.mode=normal skew_tick=1 nohz=on nohz_full=1-7 rcu_nocbs=1-7 processor.max_cstate=1 apparmor=1 security=apparmor efi=runtime

# Fallback boot entry (safe drivers)
:KAIROS OS (Fallback Boot / Safe Drivers)
protocol=limine
kernel=vmlinuz-kairos
module=/initramfs-kairos-fallback.img
options=root=LABEL=KAIROS_ROOT rootflags=subvol=@ ro kairos.mode=fallback nomodeset acpi=noirq efi=runtime

# Recovery mode entry
:KAIROS OS (Recovery Mode / Emergency Shell)
protocol=limine
kernel=vmlinuz-kairos
module=/initramfs-kairos.img
options=root=LABEL=KAIROS_ROOT rootflags=subvol=@ ro single emergency systemd.unit=rescue.target kairos.mode=recovery nomodeset

# Diagnostic mode entry
:KAIROS OS (Boot & Hardware Diagnostics)
protocol=limine
kernel=vmlinuz-kairos
module=/initramfs-kairos.img
options=root=LABEL=KAIROS_ROOT rootflags=subvol=@ ro kairos.mode=diag nomodeset loglevel=7

# Reboot entry
:Reboot System
protocol=limine
reboot=yes

# Power off entry
:Power Off System
protocol=limine
poweroff=yes