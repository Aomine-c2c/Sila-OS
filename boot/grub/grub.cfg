# GRUB Configuration for KAIROS OS (Adaptive Trading Operating System)
# Location: /boot/grub/grub.cfg

set default="0"
set timeout=3

# Load required EFI & graphical terminal modules
insmod efi_gop
insmod efi_uga
insmod font
insmod gfxterm
insmod part_gpt
insmod btrfs
insmod all_video

terminal_output gfxterm

# Clean, professional text colors (light cyan on dark slate)
set color_normal=light-gray/black
set color_highlight=cyan/black

menuentry "KAIROS OS (Adaptive Trading Operating System)" --class os --class gnu-linux {
    set root=(hd0,gpt2)
    echo "⎊ KAIROS Adaptive Wheel: Calibrating mechanical reticle [0° OBSERVE]..."
    echo "Loading KAIROS Linux kernel..."
    linux /vmlinuz-kairos root=LABEL=KAIROS_ROOT rootflags=subvol=@ ro quiet loglevel=3 \
        kairos.mode=normal \
        skew_tick=1 \
        nohz=on \
        nohz_full=1-7 \
        rcu_nocbs=1-7 \
        processor.max_cstate=1 \
        intel_idle.max_cstate=1 \
        nmi_watchdog=0 \
        apparmor=1 \
        security=apparmor \
        efi=runtime
    echo "Loading KAIROS initial ramdisk..."
    initrd /initramfs-kairos.img
}

menuentry "KAIROS OS (Fallback Boot / Safe Drivers)" --class os --class gnu-linux {
    set root=(hd0,gpt2)
    echo "Loading KAIROS Fallback kernel..."
    linux /vmlinuz-kairos root=LABEL=KAIROS_ROOT rootflags=subvol=@ ro \
        kairos.mode=fallback \
        nomodeset \
        acpi=noirq \
        efi=runtime
    echo "Loading KAIROS Fallback ramdisk..."
    initrd /initramfs-kairos-fallback.img
}

menuentry "KAIROS OS (Recovery Mode / Emergency Shell)" --class os --class gnu-linux {
    set root=(hd0,gpt2)
    echo "Entering KAIROS Emergency Recovery..."
    linux /vmlinuz-kairos root=LABEL=KAIROS_ROOT rootflags=subvol=@ ro \
        single \
        emergency \
        systemd.unit=rescue.target \
        kairos.mode=recovery \
        nomodeset
    initrd /initramfs-kairos.img
}

menuentry "KAIROS OS (Boot & Hardware Diagnostics)" --class os --class gnu-linux {
    set root=(hd0,gpt2)
    echo "Starting KAIROS Boot Diagnostics..."
    linux /vmlinuz-kairos root=LABEL=KAIROS_ROOT rootflags=subvol=@ ro \
        kairos.mode=diag \
        nomodeset \
        loglevel=7
    initrd /initramfs-kairos.img
}

menuentry "Reboot System" --class reboot {
    echo "Rebooting system..."
    reboot
}

menuentry "Power Off System" --class shutdown {
    echo "Powering off system..."
    halt
}
