# KAIROS OS User & Privilege Matrix Definition
# Strict privilege separation between research, operations, and immutable risk daemon

[groups]
wheel = 10
audio = 63
video = 39
desktop = 1010
network = 1013
trading = 1020
research = 1021
plugins = 1022
administrators = 10
riskadmin = 1003
trader = 1001
quant = 1002
operator = 1004

[users.kairos]
uid = 1000
gid = 1000
groups = wheel,desktop,audio,video,network,trading,research,operator
shell = /bin/bash
homedir = /home/kairos
description = "KAIROS Principal Workstation Operator"

[users.kairos-risk]
uid = 990
gid = 1003
groups = riskadmin
shell = /sbin/nologin
homedir = /var/lib/kairos-risk
description = "KAIROS Autonomous Risk Gatekeeper Daemon User"
system = true

[users.kairos-feed]
uid = 991
gid = 1020
groups = trading,network
shell = /sbin/nologin
homedir = /var/lib/kairos-feed
description = "KAIROS Market Data Feed Handler Service"
system = true

[users.kairos-agent]
uid = 992
gid = 1021
groups = research
shell = /sbin/nologin
homedir = /var/lib/kairos-agent
description = "KAIROS Autonomous AI Research Agent"
system = true

[users.kairos-plugin]
uid = 993
gid = 1022
groups = plugins
shell = /sbin/nologin
homedir = /var/lib/kairos-plugins
description = "KAIROS Sandboxed Strategy Plugin Runtime"
system = true
