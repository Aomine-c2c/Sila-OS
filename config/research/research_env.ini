# KAIROS Quantitative Research & Market Analytics Environment Specification

[environment]
name = kairos-research
python_version = "3.12"
cache_dir = "/var/cache/kairos/market_data"

[packages.core_analytics]
polars = "latest"
duckdb = "latest"
numpy = "latest"
scipy = "latest"
pyarrow = "latest"

[packages.visualization]
matplotlib = "latest"
seaborn = "latest"
plotly = "latest"

[packages.backtesting]
numba = "latest"
vectorbt = "latest"

[storage.market_cache]
default_format = "parquet"
compression = "zstd"
retention_days = 90
