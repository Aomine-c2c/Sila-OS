# KAIROS Flatpak & App Sandbox Policies
# Strict sandboxing for 3rd-party charting tools, web browsers, and external communications

[Policy]
default-filesystem-permission = none
allow-x11 = false
allow-wayland = true
allow-pulseaudio = true
allow-network = false # By default ungranted; granted explicitly per app

[Sandboxes.FinancialCharts]
app-id = com.tradingview.Desktop
filesystem = xdg-download:ro
network = true
wayland = true

[Sandboxes.ResearchBrowsers]
app-id = org.mozilla.firefox
filesystem = xdg-download:rw
network = true
wayland = true
