#!/usr/sbin/nft -f
# KAIROS OS Network Firewall (nftables)
# Hardened perimeter security protecting high-frequency endpoints and market gateway feeds.

flush ruleset

table inet filter {
    chain input {
        type filter hook input priority 0; policy drop;

        # Accept loopback traffic unconditionally
        iif "lo" accept

        # Accept established and related connections
        ct state established,related accept

        # Drop invalid packets
        ct state invalid drop

        # Accept ICMP / ping with rate limiting
        ip protocol icmp icmp type echo-request limit rate 10/second accept
        ip6 nexthdr icmpv6 icmpv6 type echo-request limit rate 10/second accept

        # WireGuard financial tunnel interface
        iifname "wg-kairos*" accept

        # Local LAN SSH access (restricted)
        tcp dport 22 ip saddr 192.168.0.0/16 accept
    }

    chain forward {
        type filter hook forward priority 0; policy drop;
    }

    chain output {
        type filter hook output priority 0; policy accept;
    }
}
