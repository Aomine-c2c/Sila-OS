# KAIROS Low-Latency Network Socket & TCP Kernel Tuning
# Optimized for high-throughput multicast market data and sub-millisecond execution

# TCP BBR Congestion Control & FQ scheduler
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr

# Increase socket buffer boundaries for market data bursts
net.core.rmem_max = 67108864
net.core.wmem_max = 67108864
net.core.rmem_default = 33554432
net.core.wmem_default = 33554432
net.core.optmem_max = 2048576

# Increase network device backlog & incoming packet queues
net.core.netdev_max_backlog = 250000
net.core.somaxconn = 65535

# TCP Memory parameters (min, default, max in pages)
net.ipv4.tcp_rmem = 4096 87380 67108864
net.ipv4.tcp_wmem = 4096 65536 67108864

# Low Latency & Busy-Polling Sockets
net.core.busy_read = 50
net.core.busy_poll = 50
net.ipv4.tcp_low_latency = 1
net.ipv4.tcp_fastopen = 3
net.ipv4.tcp_slow_start_after_idle = 0
net.ipv4.tcp_timestamps = 1
net.ipv4.tcp_sack = 1
net.ipv4.tcp_window_scaling = 1

# Protect against SYN flooding
net.ipv4.tcp_syncookies = 1
net.ipv4.tcp_max_syn_backlog = 8192

# IPv6 privacy extensions
net.ipv6.conf.all.use_tempaddr = 2
net.ipv6.conf.default.use_tempaddr = 2
