# ==============================================================================
# ◈ KAIROS OS - Engineered Hyprland Desktop Compositor Configuration
# Tailored specifically for quantitative trading, market analysis, and quant research.
# Priorities: Keyboard-first | Minimal | Fast | Deterministic | Zero Visual Clutter
# ==============================================================================

# --- 1. MONITOR TOPOLOGY & FRACTIONAL SCALING ---
# Syntax: monitor=name,resolution@refresh,position,scale
# Dual 4K/QHD multi-monitor setup with crisp fractional scaling
monitor = DP-1, preferred, 0x0, 1.25
monitor = DP-2, preferred, 2560x0, 1.25
monitor = HDMI-A-1, preferred, auto, 1.0
# Dynamic plug-and-play fallback for secondary displays, projectors, or virtual displays
monitor = , preferred, auto, 1.0

# --- 2. ENVIRONMENT & TOOLKIT VARIABLES ---
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = GDK_BACKEND,wayland,x11
env = CLUTTER_BACKEND,wayland
env = SDL_VIDEODRIVER,wayland
env = _JAVA_AWT_WM_NONREPARENTING,1
env = XCURSOR_THEME,Adwaita
env = XCURSOR_SIZE,24
env = HYPRCURSOR_THEME,Adwaita
env = HYPRCURSOR_SIZE,24
env = MOZ_ENABLE_WAYLAND,1
env = ELECTRON_OZONE_PLATFORM_HINT,wayland

# --- 3. AUTOSTART DAEMONS & SUPERVISED SESSION SERVICES ---
# Session watchdog supervises waybar, mako, polkit, swayidle, swaybg, cliphist, nm-applet
# If any desktop utility terminates, the watchdog restarts it automatically without disrupting windows.
exec-once = /usr/libexec/kairos/kairos-session-watchdog.sh
# System health and risk telemetry monitor
exec-once = /usr/libexec/kairos/kairos-watchdog.py

# --- 4. INPUT SUBSYSTEM: LOW-LATENCY KEYBOARD, MOUSE & TOUCHPAD ---
input {
    # Keyboard: Fast repeat rate & minimal delay for vi/terminal editing and trade execution
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options = caps:escape
    kb_rules =

    follow_mouse = 1
    repeat_rate = 50
    repeat_delay = 200

    # Mouse: Pure 1:1 hardware sensor reporting with flat acceleration (no smoothing)
    sensitivity = 0
    accel_profile = flat

    # Touchpad: Intuitive gestures and palm rejection
    touchpad {
        natural_scroll = true
        tap-to-click = true
        disable_while_typing = true
        clickfinger_behavior = true
        scroll_factor = 1.0
    }
}

gestures {
    workspace_swipe = true
    workspace_swipe_fingers = 3
    workspace_swipe_distance = 300
    workspace_swipe_invert = false
}

# --- 5. AESTHETICS & WINDOW DECORATION: MINIMALIST CYBER-FINANCIAL THEME ---
general {
    gaps_in = 3
    gaps_out = 6
    border_size = 2
    # Active window cyan accent gradient; inactive window muted slate
    col.active_border = rgba(00f0ffee) rgba(0077ffee) 45deg
    col.inactive_border = rgba(1a1e28aa)
    layout = dwindle
    no_cursor_warps = true
    allow_tearing = true
}

decoration {
    rounding = 4
    active_opacity = 1.0
    inactive_opacity = 0.96

    blur {
        enabled = true
        size = 3
        passes = 2
        new_optimizations = true
    }

    drop_shadow = true
    shadow_range = 8
    shadow_render_power = 2
    col.shadow = rgba(00000066)
}

animations {
    enabled = true
    bezier = quantSnap, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 2, quantSnap
    animation = windowsOut, 1, 2, default, popin 80%
    animation = border, 1, 3, default
    animation = fade, 1, 2, default
    animation = workspaces, 1, 2, quantSnap
}

dwindle {
    pseudotile = true
    preserve_split = true
    force_split = 2
}

# --- 6. DETERMINISTIC TRADING & QUANT WORKSPACES ---
# Workspaces are explicitly categorized for financial production:
# Workspace 1 [Quant]: Primary code editor, backtesting kernels, shell terminals
# Workspace 2 [Market]: Real-time depth of book, candlestick charts, level 2 feeds
# Workspace 3 [Risk]: System monitoring, risk gatekeeper status, journal audit
# Workspace 4 [Research]: Jupyter notebooks, data science exploratory research
# Workspace 5 [Comms]: Email, matrix/slack channels, alerts
workspace = 1, default:true
workspace = 2
workspace = 3
workspace = 4
workspace = 5

# --- 7. WINDOW RULES & SANDBOX BOUNDARIES ---
# Float dialogs, pin risk alerts, keep terminal & charts tiling
windowrulev2 = float, class:^(pavucontrol|nm-connection-editor|blueman-manager)$
windowrulev2 = float, title:^(KAIROS Emergency Shell|Risk Daemon Alert)$
windowrulev2 = bordercolor rgba(ff3366ee) rgba(ff0055ee) 45deg, title:^(Risk Daemon Alert)$
windowrulev2 = immediate, class:^(tradingview|charting|qts)*$

# --- 8. KEYBOARD-FIRST BINDINGS ---
$mainMod = SUPER

# Core Application Launchers & Command Palette
bind = $mainMod, Return, exec, foot || kitty
bind = $mainMod SHIFT, Return, exec, foot -e tmux
bind = $mainMod, Space, exec, wofi --show drun --prompt "Launch Quant Tool..."
bind = $mainMod, P, exec, python3 /usr/libexec/kairos/kairos_cmd.py --list | wofi --dmenu --prompt "KAIROS Command Palette" | xargs -r python3 /usr/libexec/kairos/kairos_cmd.py
bind = $mainMod, E, exec, foot -e lf || thunar
bind = $mainMod, Q, killactive,
bind = $mainMod SHIFT, Q, exec, hyprctl kill

# Session & System Control
bind = $mainMod, Escape, exec, swaylock -f -c 0a0c10 --inside-color 0d1117 --ring-color 00f0ff --text-color e0e6ed
bind = $mainMod SHIFT, Escape, exit,
bind = $mainMod, R, exec, foot -e kairos system info

# Audio Controls (pamixer & playerctl)
binde = , XF86AudioRaiseVolume, exec, pamixer -i 5 && notify-send -h string:x-canonical-private-synchronous:vol "Volume" "$(pamixer --get-volume)%"
binde = , XF86AudioLowerVolume, exec, pamixer -d 5 && notify-send -h string:x-canonical-private-synchronous:vol "Volume" "$(pamixer --get-volume)%"
bind = , XF86AudioMute, exec, pamixer -t && notify-send -h string:x-canonical-private-synchronous:vol "Audio" "Mute Toggled"
bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioPrev, exec, playerctl previous

# Clipboard Management (wl-clipboard + cliphist)
bind = $mainMod, V, exec, cliphist list | wofi --dmenu --prompt "Clipboard History" | cliphist decode | wl-copy

# Screenshot Utility (grim + slurp)
# Super + Print: Fullscreen capture saved to clipboard
bind = , Print, exec, grim - | wl-copy && notify-send "Screenshot" "Fullscreen captured to clipboard"
bind = $mainMod, Print, exec, grim - | wl-copy && notify-send "Screenshot" "Fullscreen captured to clipboard"
# Shift + Super + S or Shift + Print: Interactive region capture
bind = $mainMod SHIFT, S, exec, grim -g "$(slurp)" - | wl-copy && notify-send "Screenshot" "Region saved to clipboard"
bind = SHIFT, Print, exec, grim -g "$(slurp)" - | wl-copy && notify-send "Screenshot" "Region saved to clipboard"

# Window Navigation (Vim & Arrow keys)
bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Window Movement (Swap active window position)
bind = $mainMod SHIFT, h, movewindow, l
bind = $mainMod SHIFT, l, movewindow, r
bind = $mainMod SHIFT, k, movewindow, u
bind = $mainMod SHIFT, j, movewindow, d
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

# Window Management: Fullscreen, Floating, Toggle Split
bind = $mainMod, F, fullscreen, 0
bind = $mainMod SHIFT, F, fullscreen, 1
bind = $mainMod, T, togglefloating,
bind = $mainMod, P, pseudo,
bind = $mainMod, S, togglesplit,

# Dedicated Workspaces (1-5)
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5

# Move Active Window to Workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5

# Multi-Monitor Workspace Traversal
bind = $mainMod, comma, focusmonitor, -1
bind = $mainMod, period, focusmonitor, +1
bind = $mainMod SHIFT, comma, movewindow, mon:-1
bind = $mainMod SHIFT, period, movewindow, mon:+1

# Mouse Resizing and Moving (Hold Super + LMB to drag, Super + RMB to resize)
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
