<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Light & Dark compliant precise geometric styling -->
    <style>
      .ring-hub { fill: none; stroke: currentColor; stroke-width: 8; stroke-dasharray: 4 6; opacity: 0.4; }
      .outer-track { fill: none; stroke: currentColor; stroke-width: 12; opacity: 0.85; }
      .segment { fill: none; stroke-width: 24; stroke-linecap: round; }
      .core-axis { fill: currentColor; }
      .node-dot { fill: currentColor; }
      .stage-text { font-family: 'JetBrains Mono', 'Roboto Mono', monospace; font-size: 14px; font-weight: 700; fill: currentColor; text-anchor: middle; }
    </style>
  </defs>

  <!-- Central Hub / Precision Caliper Core -->
  <circle cx="256" cy="256" r="36" class="ring-hub" />
  <circle cx="256" cy="256" r="12" class="core-axis" />
  <circle cx="256" cy="256" r="84" class="ring-hub" />

  <!-- The 6 Evolutionary Dynamic Stages: OBSERVE -> DIAGNOSE -> ADAPT -> VALIDATE -> DEPLOY -> LEARN -->
  <!-- Stage 1: OBSERVE (Top-Right 300° to 350°) -->
  <path d="M 330 128 A 150 150 0 0 1 406 256" class="segment" stroke="#0284c7" />
  <!-- Stage 2: DIAGNOSE (Right 360° to 50°) -->
  <path d="M 406 256 A 150 150 0 0 1 330 384" class="segment" stroke="#059669" />
  <!-- Stage 3: ADAPT (Bottom-Right 60° to 110°) -->
  <path d="M 330 384 A 150 150 0 0 1 182 384" class="segment" stroke="#d97706" />
  <!-- Stage 4: VALIDATE (Bottom-Left 120° to 170°) -->
  <path d="M 182 384 A 150 150 0 0 1 106 256" class="segment" stroke="#dc2626" />
  <!-- Stage 5: DEPLOY (Left 180° to 230°) -->
  <path d="M 106 256 A 150 150 0 0 1 182 128" class="segment" stroke="#7c3aed" />
  <!-- Stage 6: LEARN (Top-Left 240° to 290°) -->
  <path d="M 182 128 A 150 150 0 0 1 330 128" class="segment" stroke="#0284c7" stroke-dasharray="12 12" />

  <!-- Mechanical Ratchet Teeth / Precision Evolution Indexers -->
  <!-- 0° (Observe) -->
  <circle cx="330" cy="128" r="7" class="node-dot" />
  <!-- 60° (Diagnose) -->
  <circle cx="406" cy="256" r="7" class="node-dot" />
  <!-- 120° (Adapt) -->
  <circle cx="330" cy="384" r="7" class="node-dot" />
  <!-- 180° (Validate) -->
  <circle cx="182" cy="384" r="7" class="node-dot" />
  <!-- 240° (Deploy) -->
  <circle cx="106" cy="256" r="7" class="node-dot" />
  <!-- 300° (Learn) -->
  <circle cx="182" cy="128" r="7" class="node-dot" />

  <!-- Outer Precision Reticle -->
  <circle cx="256" cy="256" r="210" class="ring-hub" stroke-width="2" />
  <line x1="256" y1="36" x2="256" y2="56" stroke="currentColor" stroke-width="4" />
  <line x1="256" y1="456" x2="256" y2="476" stroke="currentColor" stroke-width="4" />
  <line x1="36" y1="256" x2="56" y2="256" stroke="currentColor" stroke-width="4" />
  <line x1="456" y1="256" x2="476" y2="256" stroke="currentColor" stroke-width="4" />
</svg>
