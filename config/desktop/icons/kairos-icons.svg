    <path d="M8 11V7a4 4 0 0 1 8 0v4" fill="none" stroke="currentColor" stroke-width="2"/>
    <circle cx="12" cy="16" r="1.5" fill="currentColor"/>
  </symbol>

  <!-- 15. Workspace (Deterministic Multi-Screen Canvas) -->
  <symbol id="icon-workspace" viewBox="0 0 24 24">
    <rect x="3" y="4" width="18" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="2"/>
    <path d="M8 20h8M12 18v2M3 14h18" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
