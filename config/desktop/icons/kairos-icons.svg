  <symbol id="icon-rollback" viewBox="0 0 24 24">
    <path d="M3 12a9 9 0 1 0 3-6.7L2 9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    <path d="M2 4v5h5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  </symbol>

  <!-- 13. System (Kernel Subsystem & Hardware) -->
  <symbol id="icon-system" viewBox="0 0 24 24">
