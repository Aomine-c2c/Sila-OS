    <path d="M7 12h10M12 9v6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="6" cy="9" r="1" fill="currentColor"/>
    <circle cx="18" cy="15" r="1" fill="currentColor"/>
  </symbol>

