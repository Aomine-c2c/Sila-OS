<svg xmlns="http://www.w3.org/2000/svg" style="display: none;">
  <!-- 1. KAIROS Core Ring -->
  <symbol id="icon-kairos" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/>
    <circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="3 3"/>
    <path d="M12 2v3M12 19v3M2 12h3M19 12h3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  </symbol>

  <!-- 2. Market (Depth & Order Flow) -->
  <symbol id="icon-market" viewBox="0 0 24 24">
    <path d="M3 20h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    <path d="M6 16v-4M10 16V8M14 16v-6M18 16V4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    <circle cx="18" cy="4" r="1.5" fill="currentColor"/>
  </symbol>

  <!-- 3. Strategy (Algorithmic Logic Node) -->
  <symbol id="icon-strategy" viewBox="0 0 24 24">
    <rect x="4" y="4" width="6" height="6" rx="1" fill="none" stroke="currentColor" stroke-width="2"/>
    <rect x="14" y="14" width="6" height="6" rx="1" fill="none" stroke="currentColor" stroke-width="2"/>
    <path d="M10 7h4v7h-4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="2 2"/>
    <circle cx="14" cy="7" r="1.5" fill="currentColor"/>
  </symbol>

  <!-- 4. Signal (Discrete Pulse) -->
  <symbol id="icon-signal" viewBox="0 0 24 24">
    <path d="M2 12h4l3-7 6 14 3-7h4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>

  <!-- 5. Execution (High-Precision Millisecond Strike) -->
  <symbol id="icon-execution" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <path d="M12 7v5l3 3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    <path d="M17 3l4 4-2 2-4-4z" fill="currentColor"/>
  </symbol>

  <!-- 6. Risk (Hardened Gatekeeper Shield) -->
  <symbol id="icon-risk" viewBox="0 0 24 24">
