# KAIROS Foot Terminal Emulator Configuration
# High-performance, lightweight, zero-latency Wayland terminal

font=JetBrains Mono:size=11, Noto Color Emoji:size=10
pad=8x8
dpi-aware=yes

[scrollback]
lines=10000
multiplier=3.0

[cursor]
style=beam
blink=yes
color=0a0c10 00f0ff

[colors]
alpha=0.96
background=0a0c10
foreground=e0e6ed

## Normal colors
regular0=161821  # black
regular1=ff3366  # red
regular2=00ff88  # green
regular3=ffd700  # yellow
regular4=0077ff  # blue
regular5=bd93f9  # magenta
regular6=00f0ff  # cyan
regular7=e0e6ed  # white

## Bright colors
bright0=545c7e   # bright black
bright1=ff5588   # bright red
bright2=33ffaa   # bright green
bright3=ffe066   # bright yellow
bright4=3399ff   # bright blue
bright5=d6acff   # bright magenta
bright6=33f5ff   # bright cyan
bright7=ffffff   # bright white

[key-bindings]
clipboard-copy=Control+Shift+c XF86Copy
clipboard-paste=Control+Shift+v XF86Paste
search-start=Control+Shift+r
font-increase=Control+plus Control+equal Control+KP_Add
font-decrease=Control+minus Control+KP_Subtract
font-reset=Control+0 Control+KP_0
