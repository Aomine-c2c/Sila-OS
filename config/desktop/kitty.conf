# KAIROS Kitty Terminal Configuration
# High-frequency rendering, zero-latency input, GPU accelerated font rasterization

font_family      JetBrains Mono Bold
bold_font        auto
italic_font      auto
font_size        11.5

# Minimal latency rendering parameters
sync_to_monitor  no
input_delay      0
repaint_delay    2

# Color scheme (KAIROS High-Contrast Neon Dark)
background       #090b10
foreground       #e2e8f0
selection_background #1e293b
selection_foreground #38bdf8

# Color palette
color0  #1e293b
color8  #475569
color1  #f43f5e
color9  #fb7185
color2  #10b981
color10 #34d399
color3  #f59e0b
color11 #fbbf24
color4  #0ea5e9
color12 #38bdf8
color5  #a855f7
color13 #c084fc
color6  #06b6d4
color14 #22d3ee
color7  #f8fafc
color15 #ffffff
