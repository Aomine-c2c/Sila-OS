# KAIROS Mako Notification Daemon Configuration
# Prioritized display for risk alerts, latency warnings, and system events

max-history=100
sort=-time

# Style
font=JetBrains Mono 11
background-color=#0c0e14f0
text-color=#f1f5f9
border-color=#00f0ff
border-size=2
border-radius=6
padding=14
margin=10
default-timeout=5000

# High-priority risk violation styling
[urgency=critical]
border-color=#ff0055
background-color=#2a0812fa
text-color=#ffffff
default-timeout=0
