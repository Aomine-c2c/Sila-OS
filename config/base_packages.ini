# KAIROS OS Base Package Specification
# Core system baseline: Minimal, robust, security-hardened Linux distribution profile

[system]
name = kairos-os
version = 1.0.0-dev
arch = x86_64
init = systemd

[packages.base]
filesystem = latest
coreutils = latest
bash = latest
util-linux = latest
procps-ng = latest
shadow = latest
pam = latest
systemd = latest
systemd-udev = latest
kmod = latest
iproute2 = latest
nftables = latest
ethtool = latest
wireguard-tools = latest
libcap = latest
libseccomp = latest

[packages.kernel]
kernel-rt = 6.6.x-kairos-rt
linux-firmware = latest
microcode_ctl = latest

[packages.storage]
btrfs-progs = latest
xfsprogs = latest
dosfstools = latest
cryptsetup = latest
lvm2 = latest

[packages.graphics]
mesa-dri-drivers = latest
mesa-vulkan-drivers = latest
libwayland-client = latest
libwayland-server = latest
wlroots = latest
xwayland = latest
seatd = latest

[packages.desktop]
hyprland = latest
waybar = latest
wofi = latest
foot = latest
kitty = latest
mako = latest
polkit = latest
polkit-gnome = latest
swaylock = latest
swayidle = latest
swaybg = latest
wl-clipboard = latest
grim = latest
slurp = latest
pamixer = latest
playerctl = latest
network-manager-applet = latest
xdg-desktop-portal-hyprland = latest
xdg-desktop-portal = latest

[packages.security]
apparmor = latest
tpm2-tools = latest
tpm2-tss = latest
sudo = latest
gnupg = latest
